<div class="login-wrapper">
  <div class="login-card">
    <h2>Scout Login</h2>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Username</label>
        <input type="text" formControlName="username">
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" formControlName="password">
      </div>

      <p *ngIf="errorMessage" class="error-msg">{{ errorMessage }}</p>

      <button type="submit" [disabled]="!loginForm.valid" class="submit-btn">
        Access Radar
      </button>
    </form>
    <div class="link-container"><a routerLink="/register" class="nav-link">Need an account? Sign up</a></div>
  </div>
  
</div>
